name: Isolated HyperFrames render pilot

on:
  workflow_dispatch:

permissions: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_SKIP_SKILLS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare tools and synthetic source clip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p assets renders
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=720x1280:rate=24:duration=5' -c:v libx264 -pix_fmt yuv420p assets/source.mp4 -y
      - name: Install pinned HyperFrames package in this disposable VM
        run: npm install --no-save --ignore-scripts --no-audit --no-fund hyperframes@0.8.92
      - name: Validate and render
        run: |
          npx --no-install hyperframes lint .
          npx --no-install hyperframes render --workers 1 --output renders/hyperframes-pilot.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=noprint_wrappers=1 renders/hyperframes-pilot.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hyperframes-pilot-mp4
          path: renders/hyperframes-pilot.mp4
          if-no-files-found: error
          retention-days: 1
