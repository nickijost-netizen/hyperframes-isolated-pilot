<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>HyperFrames Test: Nebra</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0c1623; color: white; font-family: Arial, sans-serif; }
      #root { position: relative; width: 720px; height: 1280px; overflow: hidden; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.4) saturate(.5); }
      #shade { position: absolute; inset: 0; background: linear-gradient(transparent 30%, #06101fcc); }
      .caption { position: absolute; left: 60px; right: 60px; bottom: 190px; font-size: 68px; line-height: 1.1; font-weight: 800; text-shadow: 0 4px 12px #000; }
      #detail { position: absolute; left: 60px; right: 60px; bottom: 100px; font-size: 30px; color: #e3c77f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="720" data-height="1280" data-duration="5">
      <video id="source-a" class="clip" data-start="0" data-duration="2.5" data-track-index="0" src="assets/source-a.mp4" muted playsinline></video>
      <video id="source-b" class="clip" data-start="2.5" data-duration="2.5" data-track-index="0" src="assets/source-b.mp4" muted playsinline></video>
      <div id="shade" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="caption-a" class="clip caption" data-start="0" data-duration="2.5" data-track-index="2">Die Himmelsscheibe von Nebra</div>
      <div id="caption-b" class="clip caption" data-start="2.5" data-duration="2.5" data-track-index="2">Ein Rätsel aus Bronze und Gold</div>
      <div id="detail" class="clip" data-start="0" data-duration="5" data-track-index="3">Ein isolierter Techniktest mit künstlichem Rohvideo</div>
      <audio id="cut-sfx" data-start="2.5" data-duration="0.25" data-track-index="4" data-volume="0.25" src="assets/cut.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#caption-a", { y: 80, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.from("#caption-b", { y: 80, opacity: 0, duration: 0.8, ease: "power3.out" }, 2.8);
      tl.from("#detail", { y: 30, opacity: 0, duration: 0.6 }, 1.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
